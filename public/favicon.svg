  <!-- Hair bangs -->
  <line x1="120" y1="82" x2="112" y2="72" stroke="#e8907a" stroke-width="3" stroke-linecap="round"/>
  <line x1="127" y1="78" x2="121" y2="67" stroke="#e8907a" stroke-width="3" stroke-linecap="round"/>
  <line x1="135" y1="76" x2="131" y2="64" stroke="#e8907a" stroke-width="3" stroke-linecap="round"/>
  <line x1="143" y1="75" x2="141" y2="63" stroke="#e8907a" stroke-width="3" stroke-linecap="round"/>
  <line x1="151" y1="76" x2="151" y2="64" stroke="#e8907a" stroke-width="3" stroke-linecap="round"/>
  <!-- Closed happy eyes -->
  <path d="M 133,100 Q 136,96 139,100" fill="none" stroke="#e8907a" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 150,98 Q 153,94 156,98" fill="none" stroke="#e8907a" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Smile -->
