  <!-- Body -->
  <path d="M 108,135 L 85,155" fill="none" stroke="#e8907a" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Shirt details -->
  <path d="M 105,138 L 95,132" fill="none" stroke="#e8907a" stroke-width="3" stroke-linecap="round"/>
  <path d="M 98,145 L 88,139" fill="none" stroke="#e8907a" stroke-width="3" stroke-linecap="round"/>
  <path d="M 92,150 L 82,147" fill="none" stroke="#e8907a" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Left arm (on ground) -->
  <path d="M 95,132 Q 72,148 60,170" fill="none" stroke="#e8907a" stroke-width="3.5" stroke-linecap="round"/>
  <ellipse cx="58" cy="174" rx="7" ry="5" fill="none" stroke="#e8907a" stroke-width="3" stroke-linecap="round"/>
  <!-- Right arm (raised) -->
  <path d="M 100,140 Q 82,110 72,68" fill="none" stroke="#e8907a" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="72" y1="68" x2="68" y2="58" stroke="#e8907a" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="72" y1="68" x2="72" y2="56" stroke="#e8907a" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="72" y1="68" x2="76" y2="58" stroke="#e8907a" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Left leg (on ground) -->
  <path d="M 85,155 Q 75,170 65,185" fill="none" stroke="#e8907a" stroke-width="3.5" stroke-linecap="round"/>
  <ellipse cx="62" cy="188" rx="8" ry="5" fill="none" stroke="#e8907a" stroke-width="3" stroke-linecap="round"/>
  <!-- Right leg (kicked up) -->
  <path d="M 85,155 Q 105,150 118,158" fill="none" stroke="#e8907a" stroke-width="3.5" stroke-linecap="round"/>
  <ellipse cx="122" cy="160" rx="7" ry="5" fill="none" stroke="#e8907a" stroke-width="3" stroke-linecap="round"/>
