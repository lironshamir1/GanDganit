<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="#fff" stroke="#e8a0a0" stroke-width="2"/>

  <!-- Girl bending over - matching the logo style -->
  <!-- Head -->
  <circle cx="42" cy="18" r="10" fill="none" stroke="#d4836a" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Hair bun -->
  <circle cx="49" cy="13" r="4" fill="none" stroke="#d4836a" stroke-width="2" stroke-linecap="round"/>

  <!-- Face - simple dot eyes and smile -->
  <circle cx="40" cy="17" r="1" fill="#d4836a"/>
  <circle cx="45" cy="17" r="1" fill="#d4836a"/>
  <path d="M 40,21 Q 42.5,23 45,21" fill="none" stroke="#d4836a" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Body bending forward -->
  <path d="M 38,27 Q 30,32 22,38" fill="none" stroke="#d4836a" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Arms reaching to ground -->
  <path d="M 30,31 L 22,42" fill="none" stroke="#d4836a" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 28,33 L 18,40" fill="none" stroke="#d4836a" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Legs -->
  <path d="M 38,27 L 42,40 L 44,52" fill="none" stroke="#d4836a" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 42,40 L 36,52" fill="none" stroke="#d4836a" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Hands touching ground -->
  <circle cx="21" cy="43" r="2" fill="#d4836a" opacity="0.5"/>
  <circle cx="17" cy="41" r="2" fill="#d4836a" opacity="0.5"/>
</svg>
