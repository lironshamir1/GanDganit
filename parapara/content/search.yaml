# טבלת המיפוי של שורת החיפוש בעמוד הבית.
# ההורה כותב גיל, כיתה או מילה, והחיפוש מפנה למעבר המתאים.
# הערך בצד ימין הוא שם התיקייה של המעבר (כמו ב-transitions.yaml).
# מה שההורה כותב לא נשמר בשום מקום.

# גיל: טווח שנים ← מעבר. כותבים "מ-עד" או מספר אחד.
ages:
  "0-4": diagnosis
  "5-6": aleph
  "7-10": between
  "11-12": middle
  "13": between
  "14-15": high
  "16": between
  "17-21": graduation

# כיתה: אות הכיתה ← מעבר. "גן" נחשב ככיתה.
# אפשר לכתוב "כיתה ו", "ו", "ו'" או "כיתה ו׳". כולם אותו דבר.
grades:
  גן: aleph
  א: aleph   # תחילת כיתה א' עדיין חלק מהמעבר
  ב: between
  ג: between
  ד: between
  ה: between
  ו: middle
  ז: between
  ח: between
  ט: high
  י: between
  יא: between
  יב: graduation

# מילים: בודקים אותן רק אם מה שנכתב הוא לא גיל ולא כיתה.
# אם מה שההורה כתב מכיל אחת המילים, מפנים למעבר.
# אם כמה מילים מתאימות, המילה הארוכה יותר מנצחת (כך "חטיבה עליונה" הולכת לתיכון ולא לחטיבה).
words:
  diagnosis: [אבחון, אבחנה, מאובחן, מאובחנת, התפתחות הילד, אוטיזם, עיכוב, ועדת אבחון, מכון]
  aleph: [גן חובה, טרום חובה, רישום לבית ספר, עולה לבית ספר]
  middle: [חטיבה, חטיבת ביניים, סיום יסודי]
  high: [תיכון, חטיבה עליונה]
  graduation: [סיום, אחרי בית הספר, שירות לאומי, צבא, תעסוקה, דיור]
  between: [מעבר, מסגרת, החלפת, שילוב, כיתה קטנה, חינוך מיוחד, בית ספר אחר, ועדה]
